appId: local.roundhouse.app
productName: Roundhouse
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  - LICENSE
  - README.md
  - THIRD_PARTY_NOTICES.md
extraResources:
  - from: LICENSE
    to: licenses/Roundhouse-GPL-3.0.txt
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: resources/licenses
    to: licenses/upstream
  - from: .cache/notices
    to: licenses/generated
  - from: resources/mpv
    to: mpv
  - from: native/build/Release/roundhouse_host.node
    to: native/roundhouse_host.node
  - from: resources/sounds
    to: app.asar.unpacked/resources/sounds
  - from: resources/icons
    to: app.asar.unpacked/resources/icons
win:
  executableName: Roundhouse
  icon: resources/icons/win/KickTalk_v1.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Roundhouse-${version}-setup.${ext}
  shortcutName: Roundhouse
  uninstallDisplayName: Roundhouse
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
publish: null
